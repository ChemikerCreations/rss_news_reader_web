<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSS News Reader</title>
<style>:root{font-family:system-ui,Arial;color:#172334;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{background:#102037;color:white;padding:25px 20px}header>div,main{max-width:1050px;margin:auto}h1{margin:0}header p{color:#cbd5e1}.box,article{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:20px;margin-bottom:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}main{padding:20px}button,input,select{font:inherit;border-radius:9px;padding:11px}button{border:0;background:#ec6a20;color:white;cursor:pointer}button.secondary{background:#25354c}button:disabled{opacity:.5}input,select{border:1px solid #cbd5e1}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:15px}article{display:flex;flex-direction:column;margin:0}article p{flex:1;color:#475569;line-height:1.5}article a{color:#125da5;font-weight:650}.source{font-size:12px;color:#c25117;font-weight:bold;text-transform:uppercase}small{color:#64748b}#status{padding-top:8px;white-space:pre-wrap}footer{text-align:center;color:#64748b;padding:22px}label{font-size:14px;color:#475569}</style></head>
<body><header><div><h1>◉ RSS News Reader</h1><p>Report notizie RSS | PC e Android | Backend Render</p></div></header>
<main><section class="box"><h2>Fonti disponibili</h2><div class="row"><label><input type="checkbox" id="ansa" checked> ANSA</label><label><input type="checkbox" id="wired" checked> WIRED</label><button id="refresh">↻ Aggiorna notizie</button></div><p><small>Backend: <a href="https://rss-news-reader.onrender.com/" target="_blank" rel="noopener noreferrer">rss-news-reader.onrender.com</a>. Le fonti sono quelle configurate nel backend Python.</small></p><div id="status" role="status"></div></section>
<section class="box"><div class="row"><h2 style="flex:1">Report notizie <span id="count">(0)</span></h2><button id="export" class="secondary">↓ Scarica report HTML</button></div><div class="row"><input id="search" placeholder="Cerca nelle notizie"><select id="filter"><option value="">Tutte le fonti</option><option value="ansa">ANSA</option><option value="wired">WIRED</option></select></div><p><small id="updated"></small></p></section><div id="articles" class="grid"></div></main><footer>Notizie e link appartengono ai rispettivi editori.</footer>
<script>
const API='https://rss-news-reader.onrender.com';const $=id=>document.getElementById(id);let items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>new DOMParser().parseFromString(String(s||''),'text/html').body.textContent.trim();
async function load(source){const r=await fetch(`${API}/rss?source=${encodeURIComponent(source)}`,{headers:{Accept:'application/json'}});if(!r.ok)throw Error(`HTTP ${r.status}`);const data=await r.json();if(!Array.isArray(data.articles))throw Error('Risposta inattesa dal backend');return data.articles.map((a,i)=>({id:source+':'+i,source,title:a.title||'Senza titolo',summary:strip(a.summary),link:a.link||'',date:a.published||''}));}
async function refresh(){const sources=['ansa','wired'].filter(s=>$(s).checked);$('refresh').disabled=true;$('status').textContent='Caricamento in corso... (Render potrebbe richiedere tempo al primo accesso)';if(!sources.length){items=[];$('status').textContent='Seleziona almeno una fonte.';render();$('refresh').disabled=false;return;}const result=await Promise.allSettled(sources.map(load));items=result.flatMap(r=>r.status==='fulfilled'?r.value:[]).sort((a,b)=>{const x=Date.parse(a.date)||0,y=Date.parse(b.date)||0;return y-x});const errors=result.flatMap((r,i)=>r.status==='rejected'?[`${sources[i].toUpperCase()}: ${r.reason.message}`]:[]);$('status').textContent=`${items.length} notizie caricate.`+(errors.length?'\nProblemi: '+errors.join(' | ')+'. Verifica che il backend sia attivo e che CORS consenta il sito.':'');$('updated').textContent='Aggiornato il '+new Date().toLocaleString('it-IT');$('refresh').disabled=false;render();}
function filtered(){const q=$('search').value.toLocaleLowerCase('it'),f=$('filter').value;return items.filter(a=>(!f||a.source===f)&&[a.title,a.summary,a.source].join(' ').toLocaleLowerCase('it').includes(q));}
function render(){const data=filtered();$('count').textContent=`(${data.length})`;$('articles').innerHTML=data.map(a=>`<article><span class="source">${esc(a.source)}</span><h3>${esc(a.title)}</h3><p>${esc(a.summary.slice(0,550)||'Sintesi non disponibile nel feed.')}</p><div class="row" style="justify-content:space-between"><small>${Number.isFinite(Date.parse(a.date))?new Date(a.date).toLocaleString('it-IT'):esc(a.date||'Data non disponibile')}</small>${/^https?:\/\//i.test(a.link)?`<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Leggi articolo ↗</a>`:''}</div></article>`).join('')||'<div class="box">Nessuna notizia da visualizzare.</div>';}
function download(){const data=filtered();const html=`<!doctype html><html lang="it"><meta charset="utf-8"><title>Report RSS</title><style>body{font:16px Arial;max-width:850px;margin:35px auto;line-height:1.5}article{padding:20px 0;border-bottom:1px solid #ddd}small{color:#64748b}</style><h1>Report notizie RSS</h1><p>Generato il ${esc(new Date().toLocaleString('it-IT'))} · ${data.length} articoli</p>${data.map(a=>`<article><small>${esc(a.source)} · ${esc(a.date)}</small><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p>${/^https?:\/\//i.test(a.link)?`<a href="${esc(a.link)}">Leggi articolo</a>`:''}</article>`).join('')}</html>`;const u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='report-rss.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('refresh').onclick=refresh;$('search').oninput=render;$('filter').onchange=render;$('export').onclick=download;refresh();
</script></body></html>
